
name: FusionScale Windows DX12 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Diagnose submodules
        shell: bash
        run: |
          git submodule status --recursive
          ls -la sample/libs
          ls -la sample/libs/Cauldron || true

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status --recursive
          test -f sample/libs/Cauldron/CMakeLists.txt

      - name: Verify Cauldron
        shell: bash
        run: |
          git submodule status --recursive
          test -f sample/libs/Cauldron/CMakeLists.txt
          test -f sample/libs/Cauldron/common.cmake
          echo "Cauldron checkout: OK"

      - name: Configure
        run: cmake -S sample -B sample/build-win -A x64 -DGFX_API=DX12

      - name: Build
        run: cmake --build sample/build-win --config Release

      - name: Prepare FusionScale package
        shell: bash
        run: |
          mkdir -p fusion-package/bin
          mkdir -p fusion-package/media
          cp -r sample/bin/. fusion-package/bin/
          cp -r sample/media/Cauldron-Media fusion-package/media/

      - name: Upload FusionScale DX12 build
        uses: actions/upload-artifact@v4
        with:
          name: FusionScale-DX12
          path: fusion-package/**
          if-no-files-found: error


name: FusionScale Windows DX12 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Diagnose submodules
        shell: bash
        run: |
          git submodule status --recursive
          ls -la sample/libs
          ls -la sample/libs/Cauldron || true

      - name: Configure
        run: cmake -S sample -B sample/build-win -A x64

      - name: Build
        run: cmake --build sample/build-win --config Release
